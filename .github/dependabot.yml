version: 2

# Covers both ecosystems on purpose. FlexHeader's Dependabot watched npm only,
# ran five times in 2024 and has been silent since -- so its pinned actions and
# its dependency tree have both been drifting, unattended, on an <all_urls>
# extension. Grouping keeps the pull request volume low enough that this one
# does not get ignored the same way.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    # Wait a week before proposing an update to a freshly published version.
    # The npm attacks worth worrying about are published and yanked within
    # hours, and an automated PR that lands one on the day it appears is a
    # supply-chain hole dressed as diligence. A week costs nothing here:
    # nothing in this tree is urgent enough to need a same-day bump, and a real
    # advisory arrives through Dependabot alerts rather than version updates.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise; anything major still arrives on its own
      # so it gets read.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Toolchain moves together or not at all -- a wxt bump without its vite
      # peer is just a broken build in a separate pull request.
      build-toolchain:
        patterns:
          - wxt
          - vite
          - '@vitejs/*'
          - vitest
          - '@vitest/*'
          - typescript
          - typescript-eslint
          - eslint
          - '@eslint/*'
    # TypeScript 7 (the Go port) installs cleanly and then breaks linting:
    # typescript-eslint still caps its peer at `>=4.8.4 <6.1.0`. Because
    # typescript sits in the build-toolchain group, proposing it does not
    # produce one rejectable PR -- it makes the whole group unmergeable, so
    # the useful bumps in it get held hostage by a bump that cannot land.
    # The bound mirrors that peer range rather than the major, since 6.0.x
    # is still within it and would be fine to take.
    # Remove this once `npm view typescript-eslint@latest peerDependencies`
    # admits 6.1 or later.
    ignore:
      - dependency-name: typescript
        versions:
          - '>=6.1.0'
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'

  # Actions are pinned to full commit SHAs, which means they cannot float to a
  # backdoored tag -- and equally that they will never pick up a security fix
  # on their own. Dependabot is what turns a SHA pin from "frozen" into
  # "deliberately updated", so this entry is load-bearing rather than routine.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    # Wait a week before proposing an update to a freshly published version.
    # The npm attacks worth worrying about are published and yanked within
    # hours, and an automated PR that lands one on the day it appears is a
    # supply-chain hole dressed as diligence. A week costs nothing here:
    # nothing in this tree is urgent enough to need a same-day bump, and a real
    # advisory arrives through Dependabot alerts rather than version updates.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
